<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculetor</title>
  <style>
.btn1{
    margin: 5px;
    padding: 10px;
    font-size: 20px;
    background-color: #000000;
    border: 1px solid #ccc;
    border-radius: 5px;
    color: #f8f3f3;
    cursor: pointer;
    width: 50px;
  }
  .btn2{
    margin: 5px;
    padding: 10px;
    font-size: 20px;
    background-color: #1eff00;
    border: 1px solid #ccc;
    border-radius: 5px;
    color: #333;
    cursor: pointer;
    width: 50px;
  }
  .btn3{
    margin: 5px;
    padding: 10px;
    font-size: 20px;
    background-color: #e74444;
    border: 1px solid #ccc;
    border-radius: 5px;
    color: #333;
    cursor: pointer;
    width: 50px;
  }
  .btn4{
    margin: 5px;
    padding: 10px;
    font-size: 20px;
    background-color: #e8f401;
    border: 1px solid #ccc;
    border-radius: 5px;
    color: #333;
    cursor: pointer;
    width: 50px;
  }
  .display{
   width: 240px;
   height: 45px;
   border: 2px solid red;
   display: block;
   font-size: large;

  }
  </style>
</head>
<body>
  <input type="text" class="display">

  <button class="btn1" onclick="
   clickk('1');
  
  ">1</button>
  <button class="btn1" onclick="
   clickk('2')
  ">2</button>

  <button class="btn1" onclick="
   clickk('3')
  ">3</button>

  <button class="btn2" onclick="
   clickk('/')
  ">/</button> <br>

  <button class="btn1" onclick="
  clickk('4')
  ">4</button>
  <button class="btn1" onclick="
  clickk('5')
  ">5</button>

  <button class="btn1" onclick="
  clickk('6')
  ">6</button>

  <button class="btn2" onclick="
  clickk('-')
  ">-</button><br>

  <button class="btn1" onclick="
  clickk('7')
  ">7</button>

  <button class="btn1" onclick="
  clickk('8')
  ">8</button>

  <button class="btn1" onclick="
  clickk('9')
  ">9</button>
  <button class="btn2" onclick="
  clickk('*')
  ">*</button><br>

  <button class="btn1" onclick="
  clickk('0')
  ">0</button>

  <button class="btn1" onclick="
  clickk('.')
  ">.</button>
  <button class="btn3" onclick="
    let value=document.querySelector('.display').value
   document.querySelector('.display').value=eval( value)
  ">DL</button>

  <button class="btn2" onclick="
  clickk('+')
  ">+</button><br>

  <button class="btn2" onclick="
  clickk(`(`)
  ">(</button>
  <button class="btn2" onclick="
  clickk(`)`)
  ">)</button>
  <button class="btn3" onclick="
  document.querySelector('.display').value=''
  
  ">AC</button>
  <button class="btn4" onclick="
  
   let values=document.querySelector('.display').value
   document.querySelector('.display').value=eval( values)
  ">=</button><br>


  <script>

  function clickk (bclk){
  document.querySelector('.display').value+=bclk;
 }
  </script>
</body>
</html>
