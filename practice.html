<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>practice</title>
  <style>
    
  </style>
</head>
<body>
<h1>Rock Paper Scissors Game</h1>
<button onclick="
playGame('rock')
">Rock</button>

<button onclick="
playGame('paper')

">Paper</button>

<button onclick="
playGame('scissors')
">Scissor</button>

<p class="js-show-result"></p>
<p class="js-show-move"></p>
<p class="js-show-ans"></p>

<button onclick="
totalResult. wins= 0;
totalResult. loses= 0;
totalResult. ties= 0;
localStorage.removeItem('score')
displayScore();

">Reset</button><br><br><br>
<input placeholder=" input-cost" class="cost-input">
<button onclick="
ans();
">calculate</button>
<p class="js-show-cal"></p>
<script>

let totalResult= JSON.parse( localStorage.getItem('score')) ||{
wins : 0,
loses :0,
ties :0
}
function ans(){

  let cal= document.querySelector('.cost-input');
  let cost =Number(cal.value)
  if(cost< 50){
  cost+=10
 }
 document.querySelector('.js-show-cal')
 .innerHTML=`${cost}`
} 

 function displayScore(){
 document.querySelector('.js-show-result')
 .innerHTML=`Wins : ${totalResult.wins}  Lose : ${totalResult.loses} Ties : ${totalResult.ties}`
 }
 displayScore();



function computerMove(){  
const rand=Math.random();
let cpm='';
if(rand>=0 && rand <1/3){
 cpm='rock'
}
else if(rand>=1/3 && rand <2/3){
 cpm='paper'
}
else if(rand>=2/3 && rand <1){
 cpm='scissors'
}
return cpm;
}

function playGame(playerMove){
let result='';  
let cpm=computerMove();
if(playerMove==='rock'){
if(cpm==='rock'){
  result='tie'
}
else if(cpm==='paper'){
  result='lose'
}
else if(cpm==='scissors'){
  result='win'
}
}


else if(playerMove==='paper'){
if(cpm==='rock'){
  result='win'
}
else if(cpm==='paper'){
  result='tie'
}
else if(cpm==='scissors'){
  result='lose'
}
}

else if(playerMove==='scissors'){
if(cpm==='rock'){
  result='lose'
}
else if(cpm==='paper'){
  result='win'
}
else if(cpm==='scissors'){
  result='tie'
}
}

if(result==='win'){
  totalResult.wins +=1
}
else if(result==='lose'){
  totalResult.loses +=1
}
else if(result==='tie'){
  totalResult.ties +=1
}

localStorage.setItem('score',JSON.stringify(totalResult))
displayScore();

 document.querySelector('.js-show-move')
 .innerHTML=`you pick ${playerMove} --- computer pick ${cpm}`

 document.querySelector('.js-show-ans')
 .innerHTML=` ${result}`


}



</script>
</body>
</html>
