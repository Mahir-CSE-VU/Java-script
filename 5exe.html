<head>

  <style>
  .btn1,.bt5{
    margin: 5px;
    padding: 10px;

  }
  .btn2, .btn3, .btn4, .btn5, .btn6,.bt1,.bt2,.bt3,.bt4{
    margin: 5px;
    padding: 10px;
    font-size: 20px;
    background-color: #06ea15;
    border: 1px solid #ccc;
    border-radius: 5px;
    color: #333;
    cursor: pointer;
  }
.btn7, .btn8, .btn9, .btn10,.bt6{
    margin: 5px;
    padding: 10px;
    font-size: 20px;

<body>
  <button class="btn1" onclick="console.log(quantity)">Show Quantity</button>
  <button class="btn2" onclick="console.log(quantity+=1)">Add to Cart</button>
  <button class="btn3" onclick="console.log(quantity+=2)">+2</button>
  <button class="btn4" onclick="console.log(quantity+=3)">+3</button>
  <button class="btn5" onclick="console.log(quantity+=4)">+4</button>
  <button class="btn6" onclick="console.log(quantity+=5)">+5</button>
  <button class="btn7" onclick="console.log(quantity-=1)">-1</button>
  <button class="btn8" onclick="console.log(quantity-=2)">-2</button>
  <button class="btn9" onclick="console.log(quantity-=3)">-3</button>
  <button class="btn10"onclick="console.log(quantity=0)">Reset</button><br><br>

  <button class="bt1" onclick="console.log(calculation+='1')">1</button>
  <button class="bt2" onclick="console.log(calculation+='2')">2</button>
  <button class="bt3" onclick="console.log(calculation+='3')">3</button>
  <button class="bt4" onclick="console.log(calculation+='+')">+</button>
  <button class="bt4" onclick="console.log(calculation+='-')">-</button>
  <button class="bt4" onclick="console.log(calculation+='*')">*</button>
  <button class="bt4" onclick="console.log(calculation+='/')">/</button>
  <button class="bt5" onclick="console.log(eval(calculation))">=</button>
  <button class="bt6" onclick="console.log(calculation='')">Reset</button>
  

<script>

  let name ='Mahir';

let cost=5+3*2+9;
console.log(cost);
console.log(`Cost of Food $${cost}`);

let costwithTax=cost*0.1;

let quantity=0;
let calculation="";
</script>
