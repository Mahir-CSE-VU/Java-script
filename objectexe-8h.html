<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Flip Game</title>
  <style>
    h1{

    text-align: center;
    color: rgb(212, 12, 35);
    }
    div{

        display: flex;
        justify-content: center;    
        height: 60px;

    }
  button {

        width: 100px;
        padding: 10px;
        margin: 5px;
        margin-right: 20px;
        border-radius: 15px; 
        border: 2px solid red;
        background-color: black;
        color: azure;
        font-weight: bold;
        font-family:' sans-serif';
        font-size: 20px;
        
        
        }
  </style>
</head>
<body>
  <h1>Coin Flip Game</h1>
  <div>

<button onclick="

  playGame('Head')
  
  ">Heads</button>

<button onclick="

playGame('Tails')
  
  ">Tails</button>

  <button onclick="
  resultCount.win=0;
  resultCount.lose=0;
  alert(`Score Reset 
Wins : ${resultCount.win}  loses : ${resultCount.lose}`);
  
  ">Reset</button>

</div>


  <script>
    //object//

  const resultCount = JSON.parse(localStorage.getItem('sres')) || {
   win : 0,
   lose: 0
    }

  
//function//
 function cpMov(){

 const rand=Math.random();
 let cpm='';

  
  if(rand>=0 && rand <0.5){
    cpm='Head'
  }
  else  if(rand >=0.5 && rand < 1){
    cpm='Tails' 
  }
  return cpm;
}

function playGame(playerMove){
 let result=''; 
 let cpm=cpMov();

 //TAILS//

if(playerMove==='Tails'){

  if(cpm === 'Head'){
    result = 'Lose';
  }
  else if(cpm ==='Tails'){
    result='Win';
  }
}

//HEAD//

  else if(playerMove==='Head'){

  if(cpm === 'Head'){
    result = 'Win';
  }
  else if(cpm ==='Tails'){
    result='Lose';
  }
  }

if(result ==='Win'){
  resultCount.win += 1;
}
else if(result==='Lose'){
  resultCount.lose += 1
}

localStorage.setItem('sres',JSON.stringify(resultCount));

alert(`You chose ${playerMove}  coin landed  ${cpm}, you ${result}
Wins : ${resultCount.win}  Loses : ${resultCount.lose}

`);
}

  </script>
</body>
</html>
